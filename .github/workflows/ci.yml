name: Driver checks
on:
  push:
  pull_request:
permissions:
  contents: read
  checks: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - name: Formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Unit tests
        id: unit_tests
        run: cargo test --locked --manifest-path rust/Cargo.toml 2>&1 | tee rust-tests.log
      - name: Report test failure
        if: failure() && steps.unit_tests.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('rust-tests.log', 'utf8').slice(-30000);
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
              name: 'Rust test diagnostics', status: 'completed', conclusion: 'failure',
              output: {title: 'Rust host checks failed', summary: `Build/test output:\n\n\`\`\`text\n${log}\n\`\`\``}
            });
      - name: Defensive and concurrent stress
        run: ./tools/verify-host-stress.sh
      - name: Lints
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Release build
        run: cargo build --locked --manifest-path rust/Cargo.toml --release --all-features
      - name: Verification regressions
        run: python3 -m unittest discover -s tools/tests -v
      - name: Shell syntax
        run: for script in tools/*.sh; do bash -n "$script"; done
