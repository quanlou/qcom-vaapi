[package]
name = "qcom-vaapi"
version = "0.1.1-rc.10"
edition = "2024"
description = "A Rust VA-API backend for Qualcomm Iris video decoding through Linux V4L2."
license = "MIT"

[features]
# Explicit installation variant for experimental 8-bit AV1 with the CBS helper.
system-av1 = []
# Optional GPU byte-plane transfers for retained and incompatible surfaces.
gpu-copy = []
# Unqualified Iris firmware experiment. Normal builds retain the 4K envelope.
experimental-8k = []

[lib]
name = "msm_drv_video"
crate-type = ["cdylib"]

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
